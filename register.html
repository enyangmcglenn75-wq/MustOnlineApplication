
<!DOCTYPE html>
<html>
<head>
    <title>MUST Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <img src="Must.png" width="80">
        <h2>MUST STUDENT PORTAL</h2>
        <p>Mbarara University of Science and Technology</p>
    </div>

    <div class="container">
        <h2>Create Account</h2>
        <p>Enter your details to register.</p>

        <form>
            <label>Surname</label>
            <input type="text" placeholder="Enter surname" required>

            <label>Other Names</label>
            <input type="text" placeholder="Enter other names" required>

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number" required>

            <label>Email Address</label>
            <input type="email" placeholder="Enter email" required>

            <label>Gender</label>
            <select>
                <option>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            <label>Password</label>
            <input type="password" placeholder="Create password" required>

            <button type="submit">Create Account</button>
        </form>

        <p>Already registered? <a href="index.html">Login</a></p>
    </div>

    <footer>
        <p>MUST Student Portal | 2026</p>
    </footer>

</body>
</html>
