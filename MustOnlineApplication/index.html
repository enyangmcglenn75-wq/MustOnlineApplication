
<!DOCTYPE html>
<html>
<head>
    <title>MUST Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <img src="Must.png" width="80">
        <h2>MUST STUDENT PORTAL</h2>
        <p>Mbarara University of Science and Technology</p>
    </div>

    <div class="container">
        <h2>Student Login</h2>
        <p>Welcome! Login to your account.</p>

        <form>
            <label>Email Address</label>
            <input type="email" placeholder="Enter email" required>

            <label>Password</label>
            <input type="password" placeholder="Enter password" required>

            <p><a href="#">Forgot Password?</a></p>

            <button type="submit">Sign In</button>
        </form>

        <p>New student? <a href="register.html">Create Account</a></p>
    </div>

    <footer>
        <p>MUST Student Portal | 2026</p>
    </footer>

</body>
</html>
